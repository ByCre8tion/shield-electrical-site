name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild so new blog posts get static pages (they show live right away regardless)
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-media.mjs
      - run: node scripts/fetch-posts.mjs
      - run: npm run build
      # Keyless login: GitHub proves it is this repo, Google trusts only this repo (see scripts/gcp-setup.sh)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/284129201238/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@shield-electrical-az.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@14 deploy --only hosting --project shield-electrical-az --non-interactive
